name: Build & Release

on:
  push:
    tags:
      - "v*"            
  workflow_dispatch:    

permissions:
  contents: write       

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: osheet             
  ENTRY_POINT: main.py        
  PYTHON_VERSION: "3.14"
  NUITKA_FLAGS: --standalone --onefile --deployment 

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      NUITKA_CACHE_DIR: .nuitka_cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and Nuitka
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U nuitka

      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: .nuitka_cache
          key: ${{ runner.os }}-nuitka-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-${{ env.PYTHON_VERSION }}-

      - name: Build single-file executable
        id: build
        shell: pwsh
        run: |
          # MSVC (Visual Studio Build Tools) is preinstalled on windows-latest
          $flags = $env:NUITKA_FLAGS -split '\s+'
          python -m nuitka @flags --windows-console-mode=force $env:ENTRY_POINT
          $base = [System.IO.Path]::GetFileNameWithoutExtension($env:ENTRY_POINT)
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'AMD64') { 'x64' } else { $env:PROCESSOR_ARCHITECTURE.ToLower() }
          Move-Item "$base.dist/$base.exe" "$env:APP_NAME-windows-$arch.exe"
          "asset=$env:APP_NAME-windows-$arch.exe" >> $env:GITHUB_OUTPUT

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.build.outputs.asset }}
          fail_on_unexpected_content: false   # other jobs upload to the same release

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.asset }}
          path: ${{ steps.build.outputs.asset }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    env:
      NUITKA_CACHE_DIR: .nuitka_cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U nuitka

      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: .nuitka_cache
          key: ${{ runner.os }}-nuitka-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-${{ env.PYTHON_VERSION }}-

      - name: Build single-file executable
        id: build
        run: |
          # gcc is preinstalled on ubuntu-latest
          python -m nuitka $NUITKA_FLAGS $ENTRY_POINT
          base=$(basename "$ENTRY_POINT" .py)
          mv "$base.dist/$base.bin" "$APP_NAME-linux-$(uname -m)"
          echo "asset=$APP_NAME-linux-$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.build.outputs.asset }}
          fail_on_unexpected_content: false

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.asset }}
          path: ${{ steps.build.outputs.asset }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    env:
      NUITKA_CACHE_DIR: .nuitka_cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U nuitka

      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: .nuitka_cache
          key: ${{ runner.os }}-nuitka-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-${{ env.PYTHON_VERSION }}-

      - name: Build single-file executable
        id: build
        run: |
          # Clang (Xcode Command Line Tools) is preinstalled on macos-latest
          python -m nuitka $NUITKA_FLAGS $ENTRY_POINT
          base=$(basename "$ENTRY_POINT" .py)
          mv "$base.dist/$base.bin" "$APP_NAME-darwin-$(uname -m)"
          echo "asset=$APP_NAME-darwin-$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.build.outputs.asset }}
          fail_on_unexpected_content: false

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.asset }}
          path: ${{ steps.build.outputs.asset }}